<body>
    <h1>Click in the corresponding button to change the background color!</h1>
        <div id="button-container">
            <button id="red-button" style="background-color: red;" onclick="changeBackgroundColor(this)">Red</button>
            <button id="green-button" style="background-color: green;" onclick="changeBackgroundColor(this)">Green</button>
            <button id="blue-button" style="background-color: blue;" onclick="changeBackgroundColor(this)">Blue</button>
            <button id="yellow-button" style="background-color: yellow;" onclick="changeBackgroundColor(this)">Yellow</button>
            <button id="black-button" style="background-color: black; color: white;" onclick="changeBackgroundColor(this)">Black</button>
            <button id="white-button" style="background-color: white;" onclick="changeBackgroundColor(this)">White</button>
    </div>

    <script src="script.js"></script>
</body>
