<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1><b>Calculadora Básica</b></h1>
    <div class="display">0</div>
    <div class="numeros">
        <div>
            <button>1</button>
            <button>2</button>
            <button>3</button>
        </div>
        <div>
            <button>4</button>
            <button>5</button>
            <button>6</button>
        </div>
        <div>
            <button>7</button>
            <button>8</button>
            <button>9</button>
        </div>
        <div>
            <button>0</button>
        </div>
    </div>
    <div>
        <button class="soma">+</button>
        <button class="subtracao">-</button>
        <button class="multiplicacao">*</button>
        <button class="divisao">/</button>
        <button class="ponto">.</button>
    </div>
    <div>
        <button class="limpar">C</button>
        <button class="igual">=</button>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
